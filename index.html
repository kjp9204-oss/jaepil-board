<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재필 전광판</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0f12;--panel:#161a20;--line:#262c35;--ink:#eef1f5;--muted:#8d97a5;--y:#ffcf09;--g:#3ccf7a;--r:#ff6b6b;--b:#5aa9ff;--p:#b48cff}
:root[data-theme="light"]{--bg:#f6f4ee;--panel:#fff;--line:#e3ded2;--ink:#17191c;--muted:#6b6f76;--y:#c99a00;--g:#1f9d55;--r:#d64545;--b:#2d74c9;--p:#7a52d1}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f6f4ee;--panel:#fff;--line:#e3ded2;--ink:#17191c;--muted:#6b6f76;--y:#c99a00;--g:#1f9d55;--r:#d64545;--b:#2d74c9;--p:#7a52d1}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.5}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.brand{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em}
.brand b{color:var(--y)}
.clock{font-family:"Chakra Petch",sans-serif;color:var(--muted);font-size:14px;text-align:right}
.clock strong{display:block;color:var(--ink);font-size:22px;line-height:1.1}
.ticker{overflow:hidden;border-bottom:1px solid var(--line);background:var(--panel)}
.ticker div{display:inline-block;white-space:nowrap;padding:8px 0;animation:run 40s linear infinite;font-weight:600}
.ticker span{margin:0 28px}.ticker span::before{content:"●";color:var(--y);margin-right:8px;font-size:10px;vertical-align:2px}
@keyframes run{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion: reduce){.ticker div{animation:none;padding-left:20px}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:16px 20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat p{color:var(--muted);font-size:13px}.stat strong{font-family:"Chakra Petch",sans-serif;font-size:30px;line-height:1.1}
.tabs{display:flex;gap:6px;padding:0 20px 10px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer;min-height:38px}
.tabs button[aria-pressed="true"]{background:var(--y);border-color:var(--y);color:#111}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px;padding:0 20px 24px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px 0;color:var(--ink);font:inherit;cursor:pointer;overflow:hidden}
.item[aria-current="true"]{outline:2px solid var(--y)}
.item .bar{align-self:stretch;border-radius:0 4px 4px 0}
.item h3{font-size:15px;font-weight:700;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item small{color:var(--muted)}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.done .item h3{text-decoration:line-through;color:var(--muted)}
.detail{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;position:sticky;top:78px;align-self:start}
.detail .area{font-weight:700;font-size:13px}
.detail h2{font-size:22px;margin:4px 0 10px;letter-spacing:-.02em}
.detail dl{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;margin:14px 0}
.detail dt{color:var(--muted)}
.detail .note{background:var(--bg);border-radius:10px;padding:12px;white-space:pre-line}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1;min-height:48px;border-radius:10px;border:0;font:inherit;font-weight:800;cursor:pointer}
.btn-done{background:var(--g);color:#08130c}.btn-undo{background:var(--line);color:var(--ink)}
.sched{display:flex;flex-direction:column;gap:8px}
.sched .row{display:grid;grid-template-columns:96px 1fr;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.sched time{font-family:"Chakra Petch",sans-serif;font-weight:700;color:var(--y)}
.doc{color:var(--ink);text-decoration:none}.doc:hover{border-color:var(--y)}
.hint{color:var(--muted);font-size:13px;padding:0 20px 20px}
.theme{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;margin-left:10px}
@media (max-width:780px){
 .stats{grid-template-columns:repeat(2,minmax(0,1fr));padding:12px 16px}
 header{padding:12px 16px}.tabs,.hint{padding-left:16px;padding-right:16px}
 main{grid-template-columns:1fr;padding:0 16px 20px}
 .detail{position:static;order:-1}
 .detail.empty{display:none}
}
.search{display:flex;gap:8px;padding:0 20px 12px}
.search input{flex:1;min-width:0;min-height:42px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:0 14px;font:inherit}
.search input:focus-visible,.tabs button:focus-visible,.item:focus-visible,.actions button:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.tabs button .n{font-family:"Chakra Petch",sans-serif;margin-left:6px;opacity:.7}
.group{display:flex;flex-direction:column;gap:8px}
.group+.group{margin-top:14px}
.gh{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted);font-size:13px;font-weight:700;letter-spacing:.02em;padding:0 2px}
.gh b{font-family:"Chakra Petch",sans-serif;color:var(--ink)}
details.group summary{cursor:pointer;list-style:none}
details.group summary::-webkit-details-marker{display:none}
details.group summary .gh::after{content:"펼치기 ▾";font-weight:600}
details.group[open] summary .gh::after{content:"접기 ▴"}
details.group[open] summary{margin-bottom:8px}
.today-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--y);margin-right:6px;vertical-align:1px}
.sched .row.past{opacity:.5}
.sched .row.now{border-color:var(--y)}
.sched .row span small{color:var(--muted)}
.empty-msg{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:18px;color:var(--muted)}
.copied{color:var(--g);font-size:13px;margin-top:8px;min-height:1.2em}
.fresh{color:var(--muted);font-size:12px}
.btn-req{background:var(--y);color:#111}
</style>
</head>
<body>
<header>
  <div class="brand">JAEPIL <b>BOARD</b></div>
  <div style="display:flex;align-items:center"><div class="clock"><strong id="time">--:--</strong><span id="date"></span></div><button class="theme" id="theme" aria-label="화면 밝기 바꾸기">◐</button></div>
</header>
<div class="ticker" aria-label="공지"><div id="ticker"></div></div>
<section class="stats" aria-label="요약">
  <div class="stat"><p>오늘 할 일</p><strong id="s-today">0</strong></div>
  <div class="stat"><p>재필님 차례</p><strong id="s-check" style="color:var(--y)">0</strong></div>
  <div class="stat"><p>확인 필요</p><strong id="s-doing">0</strong></div>
  <div class="stat"><p>오늘·내일 일정</p><strong id="s-sched">0</strong></div>
</section>
<nav class="tabs" aria-label="보기">
  <button data-tab="all" aria-pressed="true">전체<span class="n" id="n-all"></span></button>
  <button data-tab="mine" aria-pressed="false">재필님 차례<span class="n" id="n-mine"></span></button>
  <button data-tab="PNP" aria-pressed="false">PNP·이스포츠<span class="n" id="n-PNP"></span></button>
  <button data-tab="CML" aria-pressed="false">Control My Life<span class="n" id="n-CML"></span></button>
  <button data-tab="개인" aria-pressed="false">개인<span class="n" id="n-개인"></span></button>
  <button data-tab="sched" aria-pressed="false">일정<span class="n" id="n-sched"></span></button>
  <button data-tab="docs" aria-pressed="false">자료<span class="n" id="n-docs"></span></button>
</nav>
<div class="search"><label for="q" class="sr" style="position:absolute;left:-9999px">업무 찾기</label><input id="q" type="search" placeholder="업무 찾기 — 제목·업무 ID" autocomplete="off"></div>
<main>
  <div id="left"></div>
  <aside class="detail empty" id="detail" aria-live="polite"><p style="color:var(--muted)">왼쪽에서 업무를 누르면 내용과 진행 상태가 보여요.</p></aside>
</main>
<p class="hint">업무·일정은 채팅으로 말하면 C.C가 올립니다. 상세 정본은 통합 업무보드 시트이고, 이 화면은 공개해도 되는 한 줄 요약입니다. <span class="fresh" id="fresh"></span></p>
<script>
const AREAS={PNP:{label:'PNP·이스포츠',c:'var(--y)'},CML:{label:'Control My Life',c:'var(--p)'},'개인':{label:'개인',c:'var(--g)'},'에이온':{label:'에이온',c:'var(--b)'}};
const STATUS={todo:{label:'할 일',c:'var(--b)'},check:{label:'확인 필요',c:'var(--y)'},hold:{label:'보류',c:'var(--muted)'},done:{label:'완료',c:'var(--g)'}};
const GROUPS=[['check','확인 필요',true],['todo','할 일',true],['hold','보류',false],['done','최근 완료',false]];
let tasks=[],sched=[],notices=[],docs=[],meta={};
const REPO='https://github.com/kjp9204-oss/jaepil-board/blob/main/';
let tab='all',cur=null,q='';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const plusDays=(iso,n)=>{const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
function fullDate(due){if(!due||due==='—')return '';if(/^\d{4}-\d{2}-\d{2}$/.test(due))return due;const m=/^(\d{1,2})-(\d{1,2})$/.exec(due);return m?`${new Date().getFullYear()}-${pad(m[1])}-${pad(m[2])}`:''}
function allSched(){const fromTasks=tasks.filter(t=>t.status!=='done'&&fullDate(t.due)).map(t=>({date:fullDate(t.due),time:'',title:'마감 · '+t.title,id:t.id}));return sched.concat(fromTasks).sort((a,b)=>(a.date+(a.time||'99')).localeCompare(b.date+(b.time||'99')))}
function tick(){const d=new Date();$('#time').textContent=d.toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});$('#date').textContent=d.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});}
tick();setInterval(tick,30000);
const open_=t=>t.status!=='done';
const inTab=t=>tab==='all'||(tab==='mine'?(t.turn==='재필님'&&open_(t)):t.area===tab);
const match=t=>!q||(t.title+' '+t.id+' '+(t.note||'')).toLowerCase().includes(q);
function stats(){
 const T=todayISO(),N=plusDays(T,1),S=allSched();
 $('#s-today').textContent=tasks.filter(t=>t.today&&open_(t)).length;
 $('#s-check').textContent=tasks.filter(t=>t.turn==='재필님'&&open_(t)).length;
 $('#s-doing').textContent=tasks.filter(t=>t.status==='check').length;
 $('#s-sched').textContent=S.filter(s=>s.date===T||s.date===N).length;
 $('#n-all').textContent=tasks.filter(open_).length;
 $('#n-mine').textContent=tasks.filter(t=>t.turn==='재필님'&&open_(t)).length;
 ['PNP','CML','개인'].forEach(a=>$('#n-'+a).textContent=tasks.filter(t=>t.area===a&&open_(t)).length);
 $('#n-sched').textContent=S.filter(s=>s.date>=T).length;
 $('#n-docs').textContent=docs.length;
}
function itemHTML(t){const a=(AREAS[t.area]||AREAS['개인']),s=(STATUS[t.status]||STATUS.todo);return `<div class="${t.status==='done'?'done':''}"><button class="item" data-id="${esc(t.id)}" aria-current="${cur===t.id}"><span class="bar" style="background:${a.c}"></span><span><h3>${t.today&&open_(t)?'<span class="today-dot" title="오늘"></span>':''}${esc(t.title)}</h3><small>${a.label} · 차례 ${esc(t.turn)}${t.due&&t.due!=='—'?' · 기한 '+esc(t.due):''}</small></span><span class="chip" style="color:${s.c}">${s.label}</span></button></div>`}
function render(){
 stats();
 if(tab==='sched'){const T=todayISO(),S=allSched();
  $('#left').innerHTML=S.length?'<div class="sched">'+S.map(s=>`<div class="row ${s.date<T?'past':''} ${s.date===T?'now':''}"><time>${esc(s.date.slice(5).replace('-','/'))}${s.time?' '+esc(s.time):''}</time><span>${esc(s.title)}${s.id?`<br><small>${esc(s.id)}</small>`:''}</span></div>`).join('')+'</div>':'<div class="empty-msg">등록된 일정이 없습니다. 채팅으로 「일정 추가: 날짜 · 할 일」이라고 말하면 C.C가 올립니다.</div>';return;}
 if(tab==='docs'){$('#left').innerHTML='<div class="sched">'+docs.map(d=>`<a class="row doc" href="${REPO+encodeURI(d.file)}" target="_blank" rel="noopener"><time>${esc(d.date)}</time><span><strong>${esc(d.title)}</strong><br><small style="color:var(--muted)">${esc(d.kind)} ↗</small></span></a>`).join('')+'</div>';return;}
 const list=tasks.filter(t=>inTab(t)&&match(t));
 if(!list.length){$('#left').innerHTML=`<div class="empty-msg">${q?'찾는 업무가 없습니다.':'이 보기에 업무가 없습니다.'}</div>`;return;}
 const today=list.filter(t=>t.today&&open_(t));
 let html='';
 if(today.length&&tab!=='mine') html+=`<section class="group"><div class="gh"><span>오늘</span><b>${today.length}</b></div>${today.map(itemHTML).join('')}</section>`;
 GROUPS.forEach(([k,label,opened])=>{const g=list.filter(t=>t.status===k&&!(t.today&&open_(t)&&tab!=='mine'));if(!g.length)return;
  const inner=g.map(itemHTML).join('');
  html+= opened||q ? `<section class="group"><div class="gh"><span>${label}</span><b>${g.length}</b></div>${inner}</section>` : `<details class="group"><summary><div class="gh"><span>${label} ${g.length}</span></div></summary><div class="group">${inner}</div></details>`;});
 $('#left').innerHTML=html;
}
function show(id){cur=id;const t=tasks.find(x=>x.id===id);if(!t)return;const a=(AREAS[t.area]||AREAS['개인']),s=(STATUS[t.status]||STATUS.todo);const d=$('#detail');d.classList.remove('empty');
 d.innerHTML=`<p class="area" style="color:${a.c}">${a.label} · ${esc(t.id)}</p><h2>${esc(t.title)}</h2><span class="chip" style="color:${s.c}">${s.label}</span><dl><dt>담당</dt><dd>${esc(t.who)}</dd><dt>지금 차례</dt><dd>${esc(t.turn)}</dd><dt>기한</dt><dd>${esc(t.due||'—')}</dd><dt>오늘</dt><dd>${t.today&&open_(t)?'오늘 할 일':'—'}</dd></dl><div class="note">${esc(t.note||'메모 없음')}</div>${open_(t)?`<div class="actions"><button class="btn-req" data-act="done">끝났어요 · 복사</button><button class="btn-undo" data-act="ask">물어보기 · 복사</button></div><p class="copied" id="copied" role="status"></p>`:''}`;
 render(); if(matchMedia('(max-width:780px)').matches) d.scrollIntoView({behavior:'smooth'});}
async function copy(text){const msg=$('#copied');try{await navigator.clipboard.writeText(text);msg.textContent='복사했어요. C.C 채팅에 붙여 넣으면 시트와 전광판에 반영합니다.';}catch(e){msg.textContent='복사가 안 되면 이 문장을 그대로 보내 주세요: '+text;}}
document.addEventListener('click',e=>{const it=e.target.closest('.item');if(it)show(it.dataset.id);
 const b=e.target.closest('[data-act]');if(b&&cur){const t=tasks.find(x=>x.id===cur);copy(b.dataset.act==='done'?`${t.id} 끝났어 — ${t.title}`:`${t.id} 지금 어디까지 됐어? — ${t.title}`);}
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x===tb));try{localStorage.setItem('jaepil-board-tab',tab)}catch(e){};render();}
});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});
$('#theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':!matchMedia('(prefers-color-scheme: light)').matches;r.dataset.theme=dark?'light':'dark';};
async function getJSON(p,def){try{const r=await fetch(p,{cache:'no-store'});return r.ok?await r.json():def}catch(e){return def}}
(async()=>{[tasks,sched,notices,docs,meta]=await Promise.all([['data/tasks.json',[]],['data/schedule.json',[]],['data/notices.json',[]],['data/materials.json',[]],['data/meta.json',{}]].map(([p,d])=>getJSON(p,d)));
 try{const saved=localStorage.getItem('jaepil-board-tab');if(saved&&document.querySelector(`[data-tab="${saved}"]`)){tab=saved;document.querySelectorAll('[data-tab]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.tab===tab));}}catch(e){}
 const n=notices.length?notices:['오늘의 공지가 없습니다'];$('#ticker').innerHTML=n.concat(n).map(x=>`<span>${esc(x)}</span>`).join('');
 if(meta.updated)$('#fresh').textContent='· 마지막 반영 '+meta.updated+(meta.by?' ('+meta.by+')':'');
 render();})();
</script>
</body>
</html>
